<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Build Commands · Jupiter</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="../styles.css" rel="stylesheet"></head><body><main class="main-content p-3 p-md-5"><a href="../index.html">← Jupiter Documentation</a><section class="section-card mt-4"><h1>Build and run</h1><pre><code>npm.cmd install
npm.cmd run doctor
npm.cmd run typecheck
npm.cmd run dev
npm.cmd run build</code></pre><p><code>dev</code> launches the WPF preview. <code>build</code> creates <code>dist/Jupiter.exe</code>. Close a running Jupiter process before rebuilding the published executable.</p></section></main></body></html>
